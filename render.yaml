# ============================================================
# L3o AI — Render Blueprint
# Created by Leon Mapelera 🇲🇼
#
# This file lets Render provision both the backend (FastAPI)
# and the frontend (static React build) automatically when you
# connect this repo via "New +" -> "Blueprint" on render.com
# ============================================================

services:
  # --------------------------------------------------------
  # Backend: FastAPI + Mistral AI
  # --------------------------------------------------------
  - type: web
    name: l3o-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: codestral-latest
      - key: ALLOWED_ORIGINS
        value: "*"

  # --------------------------------------------------------
  # Frontend: React + Vite (static site)
  # --------------------------------------------------------
  - type: web
    name: l3o-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://l3o-ai-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
